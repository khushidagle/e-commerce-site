<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click 'n Shop - Men's Wear</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(to bottom right, #fff5f9, #ffe6f0);
      color: #333;
    }

    header {
      background: linear-gradient(to right, #f8a5c2, #ff5e99);
      color: white;
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
    }

    header h1 {
      margin: 0;
      font-size: 3rem;
      font-family: 'Playfair Display', serif;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 0.6rem;
      font-size: 1.2rem;
      font-style: italic;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 3rem 1rem;
      gap: 2rem;
      background-color: #fff;
    }

    .category-card {
      background: #fff;
      border: 1.5px solid #ffd6e8;
      border-radius: 14px;
      text-align: center;
      width: 260px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.1);
      display: flex;
      flex-direction: column;
    }

    .category-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.2);
    }

    .category-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
    }

    .category-card h2 {
      margin: 1rem 0 0.5rem;
      color: #d63384;
      font-size: 1.3rem;
    }

    .category-card .btn {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      margin: 1rem auto 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
    }

    .category-card .btn:hover {
      background-color: #ff1493;
      transform: scale(1.05);
    }

    footer {
      background-color: #ff69b4;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: 3rem;
      box-shadow: 0 -3px 10px rgba(255, 182, 193, 0.2);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2.2rem;
      }
      .category-card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Click 'n Shop – Men's Wear</h1>
    <p>Sharp, Stylish & Effortless Looks for Every Man</p>
  </header>

  <section class="categories">
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/c4/bd/0e/c4bd0e7bfdf50fe2abb0288ef60fc3f2.jpg" alt="Shirts" />
      <h2>Shirts</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/4d/6e/d0/4d6ed076c62495d6a929b593a74a649d.jpg" alt="T-Shirts" />
      <h2>T-Shirts</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/d7/83/ff/d783fff7dc73bd91d58ba80ceffb3c6b.jpg" alt="Jeans" />
      <h2>Jeans</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/13/e7/b5/13e7b5171be0998f81fd71df8f1956fd.jpg" alt="Trousers" />
      <h2>Trousers</h2>
      <button class="btn">View Collection</button>
    </div>
    
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/17/86/9a/17869aa87c2d0a6b3bbb80ba307b1398.jpg" alt="Ethnic Wear" />
      <h2>Ethnic Wear</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/18/23/12/182312b5caf98f6725be07060dd37027.jpg" alt="Winter Collection" />
      <h2>Winter Collection</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/18/88/01/188801c58ef83a72b55654744f283dc7.jpg" alt="Footwear" />
      <h2>Footwear</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/1200x/b2/12/b4/b212b453d37363d0a3189f48f629565d.jpg" alt="Jackets & Hoodies" />
      <h2>Jackets & Hoodies</h2>
      <button class="btn">View Collection</button>
    </div>
  </section>

  <footer>
    <p>© 2025 Click 'n Shop. All rights reserved.</p>
  </footer>

</body>
</html>
