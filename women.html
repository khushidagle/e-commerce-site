<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click 'n Shop - Women's Wear</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(to bottom right, #fffafd, #ffeaf2);
      color: #333;
    }

    header {
      background: linear-gradient(to right, #ffc0cb, #ff69b4);
      color: white;
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
    }

    header h1 {
      margin: 0;
      font-size: 3rem;
      font-family: 'Playfair Display', serif;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 0.6rem;
      font-size: 1.2rem;
      font-style: italic;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 3rem 1rem;
      gap: 2rem;
      background-color: #fff;
    }

    .category-card {
      background: #fff;
      border: 1.5px solid #ffd6e8;
      border-radius: 14px;
      text-align: center;
      width: 260px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.1);
      display: flex;
      flex-direction: column;
    }

    .category-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.2);
    }

    .category-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
    }

    .category-card h2 {
      margin: 1rem 0 0.5rem;
      color: #e91e63;
      font-size: 1.3rem;
    }

    .category-card .btn {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      margin: 1rem auto 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
    }

    .category-card .btn:hover {
      background-color: #ff1493;
      transform: scale(1.05);
    }

    footer {
      background-color: #ff69b4;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: 3rem;
      box-shadow: 0 -3px 10px rgba(255, 182, 193, 0.2);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2.2rem;
      }
      .category-card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Click 'n Shop – Women's Wear</h1>
    <p>Trendy, Comfortable & Chic Styles Just for You</p>
  </header>

  <section class="categories">
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/4f/63/2b/4f632b069a01dbe3ebd61d669b6e9d5d.jpg" alt="Tops" />
      <h2>Tops</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/69/f1/2e/69f12e733551f7126f66fd9b64f4ca3e.jpg" alt="Bottom Wear" />
      <h2>Bottom Wear</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/84/74/c3/8474c38e2a82366b7894062b6c0341e2.jpg" alt="Dresses" />
      <h2>Dresses</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/9a/8e/3b/9a8e3bc9d602068c64c7ef1e5faa85d5.jpg" alt="Accessories" />
      <h2>Accessories</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/1200x/f4/49/b7/f449b773a21f568452bbc08451055192.jpg" alt="Ethnic Wear" />
      <h2>Ethnic Wear</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/1200x/4d/21/1a/4d211a52a103d478c66aa4579622b41f.jpg" alt="Winter Collection" />
      <h2>Winter Collection</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/e3/5f/3d/e35f3de4fbdf77f36753e1e2abf09b63.jpg" alt="Sportswear" />
      <h2>Designer Saree</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/72/cd/2c/72cd2c950b8fd2cd0f504dc6e4b4e543.jpg" alt="Footwear" />
      <h2>Footwear</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/736x/76/0a/d4/760ad4d934dade28baea19d02fff0b74.jpg" alt="Handbags" />
      <h2>Handbags</h2>
      <button class="btn">View Collection</button>
    </div>
    <div class="category-card">
      <img src="https://i.pinimg.com/1200x/3f/27/d3/3f27d34c8a567f7a45640f83892925d4.jpg" alt="Indian Attire" />
      <h2>Indian Attire</h2>
      <button class="btn">View Collection</button>
    </div>
  </section>

  <footer>
    <p>© 2025 Click 'n Shop. All rights reserved.</p>
  </footer>

</body>
</html>
