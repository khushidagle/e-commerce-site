  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #fff0f5, #ffe4ec);
      color: #4b0049;
    }

    header {
      background: linear-gradient(135deg, #ff69b4, #ffb6c1);
      padding: 30px 0;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4);
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 8px;
      font-size: 1.2rem;
    }

    .team-section {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
      text-align: center;
    }

    .team-section h2 {
      color: #d1006b;
      font-size: 2.5rem;
      margin-bottom: 40px;
      position: relative;
    }

    .team-section h2::after {
      content: "";
      display: block;
      width: 60px;
      height: 4px;
      background-color: #ff69b4;
      margin: 10px auto 0;
      border-radius: 5px;
    }

    .team-members {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
    }

    .member {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(255, 105, 180, 0.3);
      padding: 25px;
      width: 260px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .member:hover {
      transform: translateY(-12px);
      box-shadow: 0 12px 24px rgba(255, 105, 180, 0.4);
    }

    .member img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff69b4;
      margin-bottom: 15px;
    }

    .member a {
      text-decoration: none;
      color: #d1006b;
      font-size: 1.3rem;
      display: inline-block;
      margin: 10px 0 5px;
      transition: color 0.2s;
    }

    .member a:hover {
      color: #99004d;
      text-decoration: underline;
    }

    .member p {
      font-size: 0.95rem;
      color: #6e005e;
    }

    .socials {
      margin-top: 10px;
    }

    .socials a {
      display: inline-block;
      margin: 0 6px;
      text-decoration: none;
      color: #ff69b4;
      font-size: 1.2rem;
      transition: color 0.2s ease;
    }

    .socials a:hover {
      color: #d1006b;
    }

    footer {
      background-color: white;
      text-align: center;
      padding: 20px;
      color: #ff69b4;
      margin-top: 60px;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .team-members {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
